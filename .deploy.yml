# 按环境名称配置目标分支和 tag 模板。
# 顶层 key 为环境名，alias 中可配置用户常用别名。
# tag 支持变量：
#   $userflag  用户标识，优先使用用户明确提供的值；未提供时退化为 git 用户名或邮箱前缀
#   $timestamp 当前时间戳，格式为 yyyyMMddHHmm

# 请根据项目实际发布约定补充线上环境配置，例如：
# prod:
#   alias:
#     - prod
#     - 正式
#     - 生产
#   branch: master
#   tag: tencent-prod-$userflag$timestamp

